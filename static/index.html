<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feedparse</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>feedparse</h1>
                <button id="addFeedBtn" class="btn-sm">+ add feed</button>
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="unread">Unread</button>
                <button class="filter-btn" data-filter="starred">Starred</button>
            </div>
            <div id="feedList" class="feed-list"></div>
            <button id="refreshBtn" class="btn-refresh">refresh feeds</button>
        </aside>

        <main class="content">
            <div id="articleList" class="article-list"></div>
        </main>

        <div id="reader" class="reader hidden">
            <div class="reader-header">
                <button id="closeReader" class="btn-sm">back</button>
                <div class="reader-actions">
                    <button id="starBtn" class="btn-sm">star</button>
                    <a id="openLink" href="#" target="_blank" class="btn-sm">open</a>
                </div>
            </div>
            <article id="readerContent"></article>
        </div>
    </div>

    <div id="addModal" class="modal hidden">
        <div class="modal-box">
            <h3>Add RSS Feed</h3>
            <input type="url" id="feedUrl" placeholder="https://example.com/feed.xml">
            <div class="modal-actions">
                <button id="modalCancel" class="btn-sm">cancel</button>
                <button id="modalAdd" class="btn-primary">add</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
